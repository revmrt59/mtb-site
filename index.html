<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mastering the Bible</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/mtb-ui.css">
  <link rel="stylesheet" href="/assets/css/mtb-ui-overrides.css">

  <style>
  /* Temporary home-page notices */
  .hero {
    position: relative;
  }

  .home-info-section {
    position: absolute;
    left: 50%;
    bottom: 0px;
    transform: translateX(-50%);
    width: min(900px, calc(100% - 40px));
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 3;
  }

  .home-info-box {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 18px;
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 8px;
    text-align: center;
    color: #fff;
  }

  .home-info-box h2 {
    margin: 0 0 4px;
    color: #fff;
    font-size: 1rem;
  }

  .home-info-box p {
    margin: 0;
    line-height: 1.4;
  }

  /* Visible Counter Footer Styling */
  .visitor-stats {
    width: 100%;
    padding: 12px 16px;
    background: #111827;
    color: #9ca3af;
    font-size: 0.9rem;
    text-align: center;
    box-sizing: border-box;
  }

  .visitor-stats strong {
    color: #f97316;
  }

  .visitor-divider {
    margin: 0 10px;
    color: #4b5563;
  }

  @media (max-width: 700px) {
    .hero {
      min-height: 0 !important;
      height: auto !important;
      padding-bottom: 0 !important;
    }

    .hero-content {
      position: relative;
      z-index: 4;
      width: 100%;
      box-sizing: border-box;
      padding-left: 16px;
      padding-right: 16px;
    }

    .hero-content h1 {
      font-size: clamp(2rem, 11vw, 3.1rem) !important;
      line-height: 1.05 !important;
    }

    .hero-content p,
    .hero-tagline {
      white-space: normal !important;
      width: auto !important;
      max-width: 100% !important;
      line-height: 1.25 !important;
    }

    .hero-controls,
    .bible-jump {
      width: 100%;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }

    #bookSelect {
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    .home-info-section {
      position: relative;
      left: auto;
      bottom: auto;
      transform: none;
      width: min(92%, 620px);
      margin: 28px auto 18px;
      z-index: 4;
    }

    .home-info-box {
      padding: 9px 14px;
    }

    header.site-header.mtb-primary-header {
      height: auto !important;
      min-height: 0;
      padding: 8px 10px !important;
    }

    .main-nav {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 10px !important;
    }

    .main-nav a {
      margin: 0 !important;
      padding: 5px 4px;
      font-size: 0.82rem;
      line-height: 1.2;
      white-space: nowrap;
    }
  }
  </style>

  <!-- Cloudflare Web Analytics -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "99465596e80542b5acc4c1e345c1891e"}'></script>
  <!-- End Cloudflare Web Analytics -->
</head>

<body>

  <header class="site-header mtb-primary-header">
    <nav class="main-nav">
      <a href="/index.html">Home</a>
      <a href="/aboutthebible.html">About the Bible</a> 
      <a href="/loc/life-of-jesus.html">The Life of Jesus</a>
      <a href="/about.html">About MTB</a> 
      <a href="/resources/index.html">Resources</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h1>Mastering the Bible</h1>
      <p class="hero-tagline">Helping Unlock the Words of Life</p>

      <div class="hero-controls bible-jump">
        <select id="bookSelect">
          <option value="">Select Book</option>
        </select>
      </div>
    </div>

    <section class="home-info-section">
      <div class="home-info-box">
      </div>

      <div class="home-info-box">
        <h2>www.mtb.bible</h2>
        <p>Draft unedited content now in blue font with orange buttons</p>
      </div>
    </section>
  </section>

  <!-- On-Screen Unique Visitor Counter -->
  <footer class="visitor-stats">
    <span>Visitors Today: <strong id="visitors-today">1</strong></span>
    <span class="visitor-divider">|</span>
    <span>Total Unique Visitors: <strong id="visitors-total">1</strong></span>
  </footer>

  <script src="/assets/js/jshero-jump.js"></script>

  <script>
    (function() {
      var totalEl = document.getElementById("visitors-total");
      var todayEl = document.getElementById("visitors-today");

      var todayStr = new Date().toISOString().slice(0, 10);
      var dayKey = "mtb_seen_" + todayStr;
      var lifetimeKey = "mtb_seen_forever";

      var isNewToday = !localStorage.getItem(dayKey);
      var isNewEver = !localStorage.getItem(lifetimeKey);

      var totalUrl = isNewEver 
        ? "https://api.counterapi.dev/v1/masteringthebible-org/alltime/up"
        : "https://api.counterapi.dev/v1/masteringthebible-org/alltime";

      var dayUrl = isNewToday
        ? "https://api.counterapi.dev/v1/masteringthebible-org/day-" + todayStr + "/up"
        : "https://api.counterapi.dev/v1/masteringthebible-org/day-" + todayStr;

      function fetchCount(url, element) {
        var controller = new AbortController();
        var timeoutId = setTimeout(function() { controller.abort(); }, 1500);

        fetch(url, { signal: controller.signal })
          .then(function(res) {
            clearTimeout(timeoutId);
            return res.json();
          })
          .then(function(data) {
            if (element && data && typeof data.count === "number") {
              element.innerText = data.count.toLocaleString();
            }
          })
          .catch(function() {
            // Keep default visible number if blocked or timed out
          });
      }

      fetchCount(dayUrl, todayEl);
      fetchCount(totalUrl, totalEl);

      try {
        localStorage.setItem(dayKey, "1");
        localStorage.setItem(lifetimeKey, "1");
      } catch (e) {}
    })();
  </script>

</body>
</html>
