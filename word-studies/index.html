<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Studies | Mastering the Bible</title>
<style>
:root{--navy:#173a5e;--gold:#b7832f;--line:#d8e1e8;--soft:#eef4f9}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#1f2b37;background:#fff}.ws-master{max-width:1500px;margin:auto;padding:26px}.ws-hero{padding:23px 26px;border:1px solid #cbd8e3;border-radius:14px;background:linear-gradient(135deg,#f7fafc,#e8f0f7);margin-bottom:18px}.ws-hero p{margin:0 0 5px;color:var(--gold);font-size:.78rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.ws-hero h1{margin:0;color:var(--navy)}.ws-filters{display:grid;grid-template-columns:1fr 1.4fr 1.2fr .8fr;gap:10px;margin:0 0 16px}.ws-filters input,.ws-filters select{width:100%;padding:10px 11px;border:1px solid #b9c8d5;border-radius:8px;background:#fff}.ws-count{margin:0 0 9px;color:#5e6872}.ws-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.ws-table{width:100%;border-collapse:collapse;min-width:850px}.ws-table th{position:sticky;top:0;background:var(--navy);color:#fff;text-align:left;padding:11px}.ws-table td{padding:11px;border-top:1px solid var(--line);vertical-align:top}.ws-table tr:nth-child(even){background:#fafcfd}.ws-study-btn{display:inline-block;padding:7px 10px;border-radius:7px;background:var(--navy);color:#fff;text-decoration:none;font-weight:700}.ws-strong{font-weight:800;color:var(--navy)}.ws-refs{font-size:.88rem;color:#66717c;max-width:440px}.ws-home{display:inline-block;margin-top:18px;color:var(--navy)}.ws-master-modal{display:none;position:fixed;inset:0;z-index:30000}.ws-master-modal.is-open{display:block}.ws-master-backdrop{position:absolute;inset:0;background:rgba(10,20,30,.58)}.ws-master-panel{position:relative;z-index:1;width:min(1000px,calc(100% - 32px));max-height:90vh;overflow:auto;margin:5vh auto;background:#fff;border-radius:12px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.28)}.ws-master-close{float:right;border:1px solid #b9c8d5;border-radius:7px;background:#fff;padding:6px 10px;cursor:pointer}@media(max-width:800px){.ws-filters{grid-template-columns:1fr 1fr}.ws-master{padding:14px}}</style></head><body>
<main class="ws-master"><header class="ws-hero"><p>Mastering the Bible</p><h1>Word Studies</h1></header>
<div class="ws-filters"><input id="fStrong" placeholder="Strong's number (H2617 / G26)"><input id="fGloss" placeholder="Gloss / English word"><select id="fBook"><option value="">All Bible books</option></select><input id="fChapter" type="number" min="1" placeholder="Chapter"></div>
<p class="ws-count" id="wsCount"></p><div class="ws-table-wrap"><table class="ws-table"><thead><tr><th>Strong's</th><th>Language</th><th>Glosses in NKJV</th><th>Books / Chapters</th><th>Locations</th><th>Study</th></tr></thead><tbody id="wsBody"></tbody></table></div><a class="ws-home" href="/">← Mastering the Bible</a></main><div class="ws-master-modal" id="wsMasterModal"><div class="ws-master-backdrop" data-close="1"></div><div class="ws-master-panel"><button class="ws-master-close" data-close="1">Close</button><div id="wsMasterBody"></div></div></div>
<script>
(async function(){const data=await fetch('/assets/data/word-studies.json',{cache:'no-store'}).then(r=>r.json());const strong=document.getElementById('fStrong'),gloss=document.getElementById('fGloss'),book=document.getElementById('fBook'),chapter=document.getElementById('fChapter'),body=document.getElementById('wsBody'),count=document.getElementById('wsCount');const books=[...new Set(data.flatMap(x=>(x.books||[]).map(b=>b.book)))].sort();books.forEach(b=>{const o=document.createElement('option');o.value=b;o.textContent=b;book.appendChild(o)});function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const fs=strong.value.trim().toLowerCase(),fg=gloss.value.trim().toLowerCase(),fb=book.value,fc=parseInt(chapter.value||'0',10);const rows=data.filter(x=>{if(fs&&!x.strong.toLowerCase().includes(fs))return false;if(fg&&!String(x.gloss||'').toLowerCase().includes(fg))return false;if(fb){const bm=(x.books||[]).find(b=>b.book===fb);if(!bm)return false;if(fc&&!(bm.chapters||[]).includes(fc))return false}else if(fc){if(!(x.books||[]).some(b=>(b.chapters||[]).includes(fc)))return false}return true});count.textContent=rows.length+' word stud'+(rows.length===1?'y':'ies');body.innerHTML=rows.map(x=>{const bc=(x.books||[]).map(b=>esc(b.book)+' '+(b.chapters||[]).join(', ')).join('<br>');const refs=(x.references||[]).slice(0,20);const more=(x.references||[]).length-refs.length;return '<tr><td class="ws-strong">'+esc(x.strong)+'</td><td>'+esc(x.language)+'</td><td>'+esc(x.gloss)+'</td><td>'+bc+'</td><td class="ws-refs">'+esc(refs.join(', '))+(more>0?' … +'+more:'')+'</td><td><a class="ws-study-btn" href="'+esc(x.href)+'">Open Study</a></td></tr>'}).join('')};[strong,gloss,book,chapter].forEach(e=>e.addEventListener(e.tagName==='SELECT'?'change':'input',render));body.addEventListener('click',async e=>{const a=e.target.closest('.ws-study-btn');if(!a)return;e.preventDefault();const modal=document.getElementById('wsMasterModal'),target=document.getElementById('wsMasterBody');target.innerHTML='<p>Loading…</p>';modal.classList.add('is-open');try{const r=await fetch(a.getAttribute('href'),{cache:'no-store'});target.innerHTML=r.ok?await r.text():'<p>Study could not be loaded.</p>'}catch(_){target.innerHTML='<p>Study could not be loaded.</p>'}});document.getElementById('wsMasterModal').addEventListener('click',e=>{if(e.target.hasAttribute('data-close'))e.currentTarget.classList.remove('is-open')});render()})().catch(e=>{document.getElementById('wsCount').textContent='Could not load Word Studies index.';console.error(e)});
</script></body></html>
